<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="dashboard-body">
    <nav class="navbar">
        <h2>Tenant Dashboard</h2>
        <button id="logoutBtn" class="btn-small">Logout</button>
    </nav>
    <div class="dashboard-container">
        <div class="card">
            <h3>Submit Maintenance Request</h3>
            <form id="requestForm">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" rows="4" required></textarea>
                </div>
                <div id="formErrorMessage" class="error-message"></div>
                <div>
                    <button type="submit" id="submitBtn" class="btn" style="width: auto; display: inline-block;">Submit Request</button>
                    <button type="button" id="cancelEditBtn" class="btn" style="width: auto; display: none; background-color: #6c757d; margin-left: 10px;">Cancel Edit</button>
                </div>
            </form>
        </div>
        
        <div class="card mt-2">
            <h3>My Requests</h3>
            <table class="requests-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="requestsTableBody">
                    <!-- Requests will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="/js/tenant.js"></script>
</body>
</html>
